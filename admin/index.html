<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消费审批管理后台</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>消费审批 · 管理后台</strong><button id="logout" hidden>退出登录</button></header>
<main><div id="mode" class="notice"></div><p id="error" role="alert"></p><p id="feedback" role="status"></p>
<section id="login"><h1>管理员登录</h1><p>独立管理入口，账号权限由服务端校验。</p><form id="loginForm"><label>账号<input name="account" required maxlength="64" autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section>
<div id="workspace" hidden><section><div class="row"><h1>举报复核</h1><label>处理状态<select id="status"><option value="PENDING">待复核</option><option value="KEPT">已保留</option><option value="REMOVED">已下架</option><option value="">全部</option></select></label><button id="refresh">刷新</button></div><div id="reports"></div><button id="more" hidden>加载更多</button></section>
<section id="detail" hidden><h2>举报详情</h2><dl><dt>举报编号</dt><dd id="reportId"></dd><dt>举报理由</dt><dd id="reasonText"></dd><dt>目标锐评</dt><dd id="content"></dd><dt>发布者标识</dt><dd id="author"></dd></dl><h3>复核记录</h3><div id="history"></div>
<form id="reviewForm"><label>复核结论<select name="decision"><option value="KEEP">保留内容</option><option value="REMOVE">确认违规并下架</option></select></label><label>复核说明<textarea name="reason" required maxlength="500"></textarea></label><button>提交复核</button></form>
<form id="restrictForm"><h3>账号处置</h3><label>账号状态<select name="status"><option value="LIMITED">限制发布</option><option value="BANNED">封禁</option><option value="NORMAL">恢复正常</option></select></label><label>处置说明<textarea name="reason" required maxlength="500"></textarea></label><button>提交账号处置</button><div class="row"><button type="button" id="ban">禁用账号</button><button type="button" id="unban">解除禁用并恢复此前状态</button></div></form></section></div>
<footer>此页面属于 B 的前端交付。真实管理员认证、权限与处置由管理后端提供。</footer></main><script src="config.js"></script><script src="api.js"></script><script src="app.js"></script></body></html>
